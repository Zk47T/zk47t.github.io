name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.166.0
      # sha256 của hugo_extended_0.166.0_linux-amd64.deb (từ hugo_0.166.0_checksums.txt); đổi version thì đổi cả dòng này
      HUGO_SHA256: 52b06555f739b1a08e04f5c31296e9bdf166a012e9b7e3137befc889dbc24db8
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0            # enableGitInfo cần full history
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Hugo (extended)
        run: |
          curl -fsSL -o hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          echo "${HUGO_SHA256}  hugo.deb" | sha256sum -c -   # file tải về bị thay đổi thì dừng build
          sudo dpkg -i hugo.deb
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        # baseURL lấy từ hugo.yaml (https://embeddedlinux.blog/). Không dùng base_url của configure-pages:
        # nó trả http:// khi Enforce HTTPS chưa bật, làm canonical/og:image sai.
        run: hugo --gc --minify
      - name: Search index (Pagefind)
        run: npx --yes pagefind@1.5.2 --site public   # ghim bản: giao diện search dùng JS API của 1.5.x
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
